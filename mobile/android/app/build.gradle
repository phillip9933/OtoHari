apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
def playProperty = providers.gradleProperty('otohari.play').getOrElse('false')
if (!(playProperty in ['true', 'false'])) {
    throw new GradleException('otohari.play must be true or false.')
}
def playBuild = playProperty == 'true'
def playVersionCode = providers.gradleProperty('otohari.playVersionCode')
if (!playBuild && playVersionCode.isPresent()) {
    throw new GradleException('otohari.playVersionCode is only for Play builds.')
}
if (!playBuild) apply from: rootProject.file('gradle/android-updater.gradle')

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

android {
    namespace = "app.droppedneedle.mobile"
    sourceSets {
        main.java.srcDir(playBuild ? 'src/play/java' : 'src/direct/java')
        test.java.srcDir 'src/testSupport/java'
        androidTest.java.srcDir 'src/testSupport/java'
        if (!playBuild) {
            test.java.srcDir 'src/directTest/java'
            androidTest.java.srcDir 'src/directAndroidTest/java'
            debug.manifest.srcFile 'src/direct/AndroidManifest.xml'
            release.manifest.srcFile 'src/direct/AndroidManifest.xml'
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.droppedneedle.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 36
        if (playVersionCode.isPresent()) {
            int candidateCode = playVersionCode.get().toInteger()
            if (candidateCode <= versionCode || candidateCode > 2100000000) {
                throw new GradleException('The Play version code must exceed the source code and fit Play limits.')
            }
            versionCode candidateCode
        }
        versionName "0.9.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.11.2"
    if (!playBuild) implementation 'io.github.phillip9933:android-updater:1.0.0'
    def media3Version = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "com.google.android.gms:play-services-cast-framework:22.3.1"
    implementation "com.google.android.gms:play-services-basement:18.9.0"
    implementation "com.google.guava:guava:33.7.2-android"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyDistributionAssets') {
    doLast {
        def webAssets = file('src/main/assets/public')
        def playMarker = new File(webAssets, 'otohari-play-channel.txt')
        if (playBuild && (!new File(webAssets, 'index.html').isFile() ||
                !playMarker.isFile() || playMarker.getText('UTF-8') != 'play\n')) {
            throw new GradleException('Run pnpm build --mode play and pnpm exec cap sync android first.')
        }
        if (!playBuild && playMarker.exists()) {
            throw new GradleException('Play web assets cannot be used for a direct APK. Rebuild and sync without Play mode.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyDistributionAssets') }
