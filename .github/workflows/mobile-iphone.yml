name: OtoHari iPhone simulator
on:
  workflow_dispatch:
  push:
    branches: [ios]
    tags: ['ios-v*']
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build && pnpm exec cap sync ios
      - name: Build and launch on an iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -onlyUsePackageVersionsFromResolvedFile -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/iphone-build" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$device" "$RUNNER_TEMP/iphone-build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device" app.dnmusic.mobile
          swiftc tests/ios/simulator/check-launch.swift -o "$RUNNER_TEMP/check-launch"
          for attempt in {1..12}; do
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/iphone-launch.png"
            if "$RUNNER_TEMP/check-launch" "$RUNNER_TEMP/iphone-launch.png"; then exit 0; fi
            sleep 2
          done
          echo "The simulator did not display the DN server address and Continue button."
          exit 1
      - name: Check the app privacy manifest in an unsigned release archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OtoHari.xcarchive"
          xcodebuild -onlyUsePackageVersionsFromResolvedFile -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = OtoHari
          share="$app/PlugIns/ShareSong.appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$share")" = app.dnmusic.mobile.ShareSong
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$share")" = com.apple.share-services
          for key in CFBundleVersion CFBundleShortVersionString; do
            test "$(/usr/libexec/PlistBuddy -c "Print :$key" "$share")" = "$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")"
          done
          bundled="$app/PrivacyInfo.xcprivacy"
          plutil -lint "$bundled"
          python3 -c 'import plistlib, sys; from pathlib import Path; assert plistlib.loads(Path(sys.argv[1]).read_bytes()) == plistlib.loads(Path(sys.argv[2]).read_bytes())' ios/App/App/PrivacyInfo.xcprivacy "$bundled"
      - name: Build the optional Now Playing widget
        run: |
          node scripts/prepare-iphone-widget.mjs
          xcodebuild -onlyUsePackageVersionsFromResolvedFile -project ios/App/AppWidgets.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/iphone-widget-build" CODE_SIGNING_ALLOWED=NO build
      - name: Test native playback and offline policies on macOS
        if: ${{ !cancelled() }}
        run: scripts/test-iphone.sh

      - name: Package the tested device archive
        if: github.event_name == 'push'
        run: |
          archive="$RUNNER_TEMP/OtoHari.xcarchive"
          info="$archive/Products/Applications/App.app/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = app.dnmusic.mobile
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "ios-v$version-build.$build"
          fi
          ditto -c -k --keepParent "$archive" "$RUNNER_TEMP/iphone-archive.zip"
      - name: Save the device archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: iphone-archive
          path: ${{ runner.temp }}/iphone-archive.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  testflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios-v')
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 25
    environment: testflight
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: iphone-archive
          path: ${{ runner.temp }}
      - name: Prepare archive and signing profile
        env:
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          SHARE_PROFILE_B64: ${{ secrets.IOS_SHARE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -eu
          umask 077
          cd "$RUNNER_TEMP"
          ditto -x -k iphone-archive.zip .
          printf '%s' "$PROFILE_B64" | base64 -D > app.mobileprovision
          printf '%s' "$SHARE_PROFILE_B64" | base64 -D > share.mobileprovision
          security cms -D -i app.mobileprovision > profile.plist
          security cms -D -i share.mobileprovision > share.plist
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' OtoHari.xcarchive/Products/Applications/App.app/Info.plist)
          python3 - "$bundle" <<'PYPROFILE'
          import datetime, plistlib, sys
          from pathlib import Path
          bundle = sys.argv[1]
          directory = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          directory.mkdir(parents=True, exist_ok=True)
          profiles = {}
          team = None
          for name, source, identifier in [('profile', 'app', bundle), ('share', 'share', bundle + '.ShareSong')]:
              profile = plistlib.loads(Path(name + '.plist').read_bytes())
              entitlements = profile['Entitlements']
              if (entitlements['application-identifier'] != profile['ApplicationIdentifierPrefix'][0] + '.' + identifier
                      or ('group.' + bundle) not in entitlements.get('com.apple.security.application-groups', [])
                      or entitlements.get('get-task-allow') or profile.get('ProvisionedDevices')
                      or profile.get('ProvisionsAllDevices') or not entitlements.get('beta-reports-active')
                      or profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)):
                  sys.exit('Use an unexpired App Store Connect profile with the shared App Group for ' + identifier)
              if team is not None and team != profile['TeamIdentifier'][0]:
                  sys.exit('Both profiles must belong to the same team.')
              team = profile['TeamIdentifier'][0]
              uuid = profile['UUID']
              (directory / (uuid + '.mobileprovision')).write_bytes(Path(source + '.mobileprovision').read_bytes())
              profiles[identifier] = uuid
          options = dict(method='app-store-connect', destination='upload', signingStyle='manual',
                         signingCertificate='Apple Distribution', teamID=team,
                         provisioningProfiles=profiles, manageAppVersionAndBuildNumber=False)
          with open('export-options.plist', 'wb') as file:
              plistlib.dump(options, file)
          PYPROFILE
      - name: Import the distribution identity in the temporary runner
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -eu
          umask 077
          cd "$RUNNER_TEMP"
          printf '%s' "$CERT_B64" | base64 -D > distribution.p12
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import distribution.p12 -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm distribution.p12
      - name: Sign and upload to App Store Connect
        env:
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -eu
          umask 077
          cd "$RUNNER_TEMP"
          printf '%s' "$ASC_KEY" > upload.p8
          xcodebuild -exportArchive -archivePath OtoHari.xcarchive -exportPath export \
            -exportOptionsPlist export-options.plist -authenticationKeyPath "$RUNNER_TEMP/upload.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/upload.p8" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/share.mobileprovision" "$RUNNER_TEMP/share.plist"
